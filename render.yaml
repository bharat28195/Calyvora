# Render.com blueprint — provisions the whole app (database + backend + frontend).
# In the Render dashboard: New > Blueprint > pick this repo. See docs/DEPLOY.md and
# docs/GO-LIVE-CHECKLIST.md for the click-by-click walkthrough.
#
# TWO ENVIRONMENTS (Option A — new services are production, existing ones become the demo):
#
#   PRODUCTION  orbit-prod-backend / orbit-prod-frontend
#               branch production · prod profile · Starter ($7) backend · orbit.calyvora.net
#               Real customers. No dev/seed/mailbox endpoints exist. Its own clean database.
#
#   DEMO        calyvora-backend / calyvora-frontend   (the services that already exist)
#               branch product/hr-platform · staging profile · free · orbit.calyvora.in
#               Throwaway. Dev/seed endpoints on. Keeps the existing database (already seeded).
#
# SEPARATE DOMAINS, NO CUTOVER: production is on its OWN domain, orbit.calyvora.net, so the demo keeps
# orbit.calyvora.in untouched — nothing has to move. Add orbit.calyvora.net to the prod frontend
# (Render custom domain) and a `orbit` CNAME on calyvora.net at Hostinger -> orbit-prod-frontend.onrender.com.
#
# BRANCHES: develop on `product/hr-platform` (the demo deploys from it); when a change is ready for
# customers, merge product/hr-platform -> `production` and the prod services redeploy. `main` is a
# separate, larger suite and is NOT a deploy source for either environment.

# SUPERSEDED by Neon — see the DB_URL blocks on the backend services. Left defined only so a sync
# does not delete the old database out from under a deployment still pointing at it. Render removes a
# free Postgres 30 days after creation (removes, not sleeps), which is why the app is on Neon.
databases:
  - name: calyvora-db
    plan: free
    region: singapore
    databaseName: calyvora
    user: calyvora

services:
  # ========================= PRODUCTION (new) =========================
  # Real customers. prod profile => the whole @Profile("!prod") dev surface (seed, mailbox, mail
  # test) does not exist, Swagger is off, cookies are secure. Always-on Starter so nobody meets a
  # cold start. Tracks `production` (ship by merging product/hr-platform -> production).

  # ---- Backend (production): Spring Boot (Docker) ----
  - type: web
    name: orbit-prod-backend
    runtime: docker
    # Always-on. The app runs in 512 MB on free already (the cold start was a successful boot, just
    # slow); Starter is the same 512 MB with 5x the CPU and no spin-down. $7/mo, billed on this one
    # service; the workspace stays Hobby ($0).
    plan: starter
    region: singapore
    branch: production
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # A FRESH Neon database for production, so it starts clean (no demo/scale leftovers). Set all
      # three by hand (sync:false). USE NEON'S DIRECT HOSTNAME, NOT the `-pooler` one: this app binds
      # its tenant with a session-scoped setting, and a transaction pooler can split that from the
      # query that relies on it — worst case, one tenant reads another's rows. Flyway also needs a
      # direct connection for its advisory lock. Region: Singapore (ap-southeast-1).
      #   DB_URL       jdbc:postgresql://<direct-host>/<database>?sslmode=require
      #   DB_USERNAME  the Neon role        DB_PASSWORD  its password
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Stamped into every invitation / verification link, and the allowed cross-site origin. This is
      # the production brand URL.
      - key: FRONTEND_BASE_URL
        value: https://orbit.calyvora.net
      - key: CORS_ALLOWED_ORIGINS
        value: https://orbit.calyvora.net,https://orbit-prod-frontend.onrender.com
      # RS256 signing keys — set by hand, never committed. Without them the app makes a throwaway
      # keypair at each boot and every restart logs all users out. Production needs its OWN keys.
      - key: JWT_KID
        sync: false
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      # Outgoing email via Resend (HTTPS 443; Render blocks SMTP). Mail still goes out FROM
      # connect@calyvora.in. Unset => console transport and a loud boot warning; prove a real send
      # before trusting signup emails.
      - key: RESEND_API_KEY
        sync: false

  # ---- Frontend (production): Next.js (native Node) ----
  - type: web
    name: orbit-prod-frontend
    runtime: node
    # Free: Next.js wakes fast and the keep-alive workflow pings it. Bump to starter for always-on.
    plan: free
    region: singapore
    branch: production
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    # The production brand domain — its own domain, so nothing is taken from the demo. Add it in the
    # dashboard (Custom Domains) and point an `orbit` CNAME on calyvora.net at Hostinger to
    # orbit-prod-frontend.onrender.com. Until DNS is live, prod is reachable on its onrender.com url.
    domains:
      - orbit.calyvora.net
    envVars:
      - key: NEXT_PUBLIC_API_MODE
        value: live
      # The PUBLIC url of the PRODUCTION backend (not the private-network host). Update if Render
      # appends a uniqueness suffix to the backend's url.
      - key: BACKEND_ORIGIN
        value: https://orbit-prod-backend.onrender.com

  # ============================ DEMO (existing) ============================
  # The services that already exist, repurposed as the demo: the working branch on the staging
  # profile, where the dev/seed endpoints live, with their OWN (existing) database so anything a
  # prospect does can never touch a paying customer. They keep running throughout the cutover.

  # ---- Backend (demo): Spring Boot (Docker) ----
  - type: web
    name: calyvora-backend
    runtime: docker
    plan: free
    region: singapore
    branch: product/hr-platform
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: staging               # dev/seed/mailbox endpoints available — a demo needs to seed
      # Keeps the EXISTING Neon database (already seeded with the demo company). These are already
      # set on this service; leave them as they are.
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: FRONTEND_BASE_URL
        value: https://orbit.calyvora.in
      - key: CORS_ALLOWED_ORIGINS
        value: https://orbit.calyvora.in,https://calyvora-frontend.onrender.com
      - key: JWT_KID
        sync: false
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      # Leave RESEND_API_KEY unset on the demo: with no provider the dev mailbox captures
      # verification/invite links (safe, since nothing is delivered), which lets a demo complete
      # signup flows without a real inbox.

  # ---- Frontend (demo): Next.js (native Node) ----
  - type: web
    name: calyvora-frontend
    runtime: node
    plan: free
    region: singapore
    branch: product/hr-platform
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    # The demo keeps orbit.calyvora.in — production is on its own calyvora.net domain, so nothing moves.
    domains:
      - orbit.calyvora.in
    envVars:
      - key: NEXT_PUBLIC_API_MODE
        value: live
      - key: BACKEND_ORIGIN
        value: https://calyvora-backend.onrender.com
