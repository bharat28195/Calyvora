# Render.com blueprint — provisions the whole app (database + backend + frontend) in one go.
# In the Render dashboard: New > Blueprint > pick this repo. Render reads this file and creates
# all three services wired together. See docs/DEPLOY.md for the click-by-click walkthrough.
#
# Free tier notes: web services sleep after ~15 min idle (first request after is slow), and the
# free Postgres is removed after 30 days. Bump plans to "starter" for always-on / persistent.

databases:
  - name: calyvora-db
    plan: free
    region: singapore          # MUST match the services' region — Render's private DB hostname
                               # (dpg-xxxx-a) only resolves inside the same region. A mismatch
                               # fails at boot with UnknownHostException on that hostname.
    databaseName: calyvora
    user: calyvora
    # Render's Postgres role is NOSUPERUSER without BYPASSRLS -> tenant Row-Level Security works.

services:
  # ---- Backend: Spring Boot (Docker) ----
  - type: web
    name: calyvora-backend
    runtime: docker
    plan: free
    region: singapore            # pick the region closest to you / your customers
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: staging
      - key: DB_HOST
        fromDatabase: { name: calyvora-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: calyvora-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: calyvora-db, property: database }
      - key: DB_USERNAME
        fromDatabase: { name: calyvora-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: calyvora-db, property: password }
      # Where the app tells users to go: invitation / email-verification links, and the origin
      # allowed to call the API cross-site. Without these they default to localhost:3000 and every
      # invite email points at the recipient's own machine.
      # Where the app tells people to go. FRONTEND_BASE_URL is stamped into every invitation and
      # verification link, so it must be the address a customer should actually see.
      #
      # ⚠️ This is the custom domain, which only works once its DNS record exists (see the frontend
      # service below). Until then, emailed links point at a hostname that doesn't resolve — the app
      # itself is fine on its onrender.com url. If you need to deploy before DNS is ready, set this
      # back to https://calyvora-frontend.onrender.com temporarily.
      - key: FRONTEND_BASE_URL
        value: https://orbit.calyvora.in
      # The custom domain plus the onrender.com url, which stays usable for opening the service
      # directly and while DNS propagates.
      #
      # app.calyvora.in is deliberately NOT here. It was configured as FRONTEND_BASE_URL but its DNS
      # record was never created — `app.calyvora.in` returns NXDOMAIN — so every invitation and
      # verification link sent while it was set pointed at a hostname that does not resolve. Nothing
      # to preserve, and listing a dead origin only suggests it once worked.
      - key: CORS_ALLOWED_ORIGINS
        value: https://orbit.calyvora.in,https://calyvora-frontend.onrender.com
      # RS256 signing keys. sync: false = set these by hand in the Render dashboard; a private key
      # must never live in this file. Without them the app generates a throwaway keypair at boot and
      # every restart (including a free-tier wake) logs all users out. See docs/DEPLOY.md.
      - key: JWT_KID
        sync: false
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      # Outgoing email — ONE variable, because everything else now lives in application.yml.
      #
      # The sending address, the trial-notification inbox and the transport choice are not secrets and
      # do not vary by deployment, so they are defaults in the app rather than dashboard fields
      # somebody has to remember. The API key is the only genuine secret, and a secret must never be
      # committed — hence sync: false, set it by hand.
      #
      # WHY NOT SMTP, given we own a Hostinger mailbox: RENDER BLOCKS OUTBOUND SMTP. Measured, not
      # assumed — smtp.hostinger.com:465 answers from a laptop and times out from here:
      #   MailConnectException: Couldn't connect to host, port: smtp.hostinger.com, 465
      #   SocketTimeoutException: Connect timed out
      # The connection never opens, so no credential, port or TLS flag can change the outcome. The
      # SMTP transport stays supported in code for a host that permits it; it is simply unusable here,
      # and the variables are gone from this file rather than left as an invitation to retry it.
      #
      # Resend sends over HTTPS on 443, which is not blocked. It carries the message; the mail still
      # goes out FROM connect@calyvora.in and replies still land in that Hostinger inbox.
      #
      # Unset ⇒ the app falls back to the console transport and says so loudly at boot. Always prove a
      # real send with POST /api/v1/dev/test-email: a send failure is swallowed on purpose (a mail
      # outage must not roll back a completed signup), so an unproven transport fails silently —
      # signup succeeds, no verification mail arrives, and the account can never be activated.
      - key: RESEND_API_KEY
        sync: false

  # ---- Frontend: Next.js (native Node) ----
  - type: web
    name: calyvora-frontend
    runtime: node
    plan: free
    region: singapore
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    # Declaring the domain here means a blueprint sync registers it and provisions the TLS
    # certificate — no dashboard clicking. It does NOT create the DNS record: add a CNAME for
    # `orbit` pointing at calyvora-frontend.onrender.com at your registrar (Hostinger), which is the
    # one step Render can't do for you. The service keeps its onrender.com url either way, so adding
    # this breaks nothing if DNS isn't ready yet.
    #
    domains:
      - orbit.calyvora.in
    envVars:
      - key: NEXT_PUBLIC_API_MODE
        value: live
      # The browser calls the frontend origin; Next proxies /api/* to the backend (first-party
      # cookies, no CORS). Read at BUILD time (next.config.mjs rewrites are baked into
      # routes-manifest.json), and Render injects blueprint env vars into builds.
      #
      # Deliberately the PUBLIC url, not `fromService property: host` — that resolves to the
      # private-network name, which serves plain http on 8080 and is not reachable as
      # https://<name>, so the proxy 500s. Update this if the backend service is ever renamed
      # or Render appends a uniqueness suffix to its url.
      - key: BACKEND_ORIGIN
        value: https://calyvora-backend.onrender.com
