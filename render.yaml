# Render.com blueprint — provisions the whole app (database + backend + frontend) in one go.
# In the Render dashboard: New > Blueprint > pick this repo. Render reads this file and creates
# all three services wired together. See docs/DEPLOY.md for the click-by-click walkthrough.
#
# Free tier notes: web services sleep after ~15 min idle (first request after is slow), and the
# free Postgres is removed after 30 days. Bump plans to "starter" for always-on / persistent.

databases:
  - name: calyvora-db
    plan: free
    region: singapore          # MUST match the services' region — Render's private DB hostname
                               # (dpg-xxxx-a) only resolves inside the same region. A mismatch
                               # fails at boot with UnknownHostException on that hostname.
    databaseName: calyvora
    user: calyvora
    # Render's Postgres role is NOSUPERUSER without BYPASSRLS -> tenant Row-Level Security works.

services:
  # ---- Backend: Spring Boot (Docker) ----
  - type: web
    name: calyvora-backend
    runtime: docker
    plan: free
    region: singapore            # pick the region closest to you / your customers
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: staging
      - key: DB_HOST
        fromDatabase: { name: calyvora-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: calyvora-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: calyvora-db, property: database }
      - key: DB_USERNAME
        fromDatabase: { name: calyvora-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: calyvora-db, property: password }
      # Where the app tells users to go: invitation / email-verification links, and the origin
      # allowed to call the API cross-site. Without these they default to localhost:3000 and every
      # invite email points at the recipient's own machine.
      # Where the app tells people to go. FRONTEND_BASE_URL is stamped into every invitation and
      # verification link, so it must be the address a customer should actually see.
      #
      # ⚠️ This is the custom domain, which only works once its DNS record exists (see the frontend
      # service below). Until then, emailed links point at a hostname that doesn't resolve — the app
      # itself is fine on its onrender.com url. If you need to deploy before DNS is ready, set this
      # back to https://calyvora-frontend.onrender.com temporarily.
      - key: FRONTEND_BASE_URL
        value: https://app.calyvora.in
      # Both origins: the custom domain for real use, and the onrender.com one so nothing breaks
      # while DNS propagates or if you ever open the service url directly.
      - key: CORS_ALLOWED_ORIGINS
        value: https://app.calyvora.in,https://calyvora-frontend.onrender.com
      # RS256 signing keys. sync: false = set these by hand in the Render dashboard; a private key
      # must never live in this file. Without them the app generates a throwaway keypair at boot and
      # every restart (including a free-tier wake) logs all users out. See docs/DEPLOY.md.
      - key: JWT_KID
        sync: false
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      # Outgoing email over Resend's HTTPS API.
      #
      # NOT SMTP: Render blocks outbound SMTP on every port (25/587/465) — connections simply time
      # out, and because a send failure is swallowed on purpose (a mail outage must not roll back a
      # completed signup) the symptom is silent: signup succeeds and no verification mail ever
      # arrives, so the account can never be activated. Port 443 is never blocked.
      #
      # Both are sync: false — an API key must never live in this file. Set them in the dashboard.
      # MAIL_FROM must be at a domain verified in Resend, or it rejects the send with a 403.
      # Unset ⇒ the app falls back to the console transport and says so loudly at startup.
      - key: MAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false

      # Where "someone wants a free trial" lands (PD-21). sync: false because it's a real inbox that
      # may change; unset, the app falls back to the platform owner's login address, so an enquiry is
      # never silently dropped. Note that until RESEND_API_KEY above is set, the notification is only
      # written to the log — a trial request nobody hears about is exactly the failure this guards.
      - key: TRIAL_NOTIFY_EMAIL
        sync: false

  # ---- Frontend: Next.js (native Node) ----
  - type: web
    name: calyvora-frontend
    runtime: node
    plan: free
    region: singapore
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    # Declaring the domain here means a blueprint sync registers it and provisions the TLS
    # certificate — no dashboard clicking. It does NOT create the DNS record: add a CNAME for `app`
    # pointing at calyvora-frontend.onrender.com at your registrar (Hostinger), which is the one
    # step Render can't do for you. The service keeps its onrender.com url either way, so adding
    # this breaks nothing if DNS isn't ready yet.
    domains:
      - app.calyvora.in
    envVars:
      - key: NEXT_PUBLIC_API_MODE
        value: live
      # The browser calls the frontend origin; Next proxies /api/* to the backend (first-party
      # cookies, no CORS). Read at BUILD time (next.config.mjs rewrites are baked into
      # routes-manifest.json), and Render injects blueprint env vars into builds.
      #
      # Deliberately the PUBLIC url, not `fromService property: host` — that resolves to the
      # private-network name, which serves plain http on 8080 and is not reachable as
      # https://<name>, so the proxy 500s. Update this if the backend service is ever renamed
      # or Render appends a uniqueness suffix to its url.
      - key: BACKEND_ORIGIN
        value: https://calyvora-backend.onrender.com
