<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Orbit</title>
<style>
  :root { color-scheme: light dark; --bg:#ffffff; --fg:#111827; --muted:#6b7280; --accent:#7c3aed; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b0b12; --fg:#f3f4f6; --muted:#9ca3af; } }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:320px; padding:24px; text-align:center; }
  h1 { font-size:22px; margin:0 0 8px; }
  p { color:var(--muted); line-height:1.5; margin:0 0 20px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:10px; padding:12px 20px; font-size:15px; }
</style>
</head>
<body>
<main>
  <h1>You're offline</h1>
  <p>Orbit needs an internet connection. Check your Wi-Fi or mobile data and try again.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
