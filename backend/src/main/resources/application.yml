spring:
  application:
    name: calyvora-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/calyvora}
    username: ${DB_USERNAME:calyvora}
    password: ${DB_PASSWORD:calyvora_local_dev}
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; JPA only validates
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never     # never leak stack traces (Sprint1 §13)

# --- Application-specific config (bound in AppProperties) ---
calyvora:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  mail:
    from: ${MAIL_FROM:no-reply@calyvora.local}
  security:
    jwt:
      # RS256 asymmetric signing with key rotation (SD-5).
      # Leaving `keys` empty generates an EPHEMERAL keypair at startup — fine for local/dev/test,
      # never for a shared env (tokens die on restart). To configure real keys, set active-kid and
      # supply one or more PKCS#8 PEM keypairs; rotate by adding a key, flipping active-kid, then
      # dropping the retired key once its last token has expired. Public keys are served at
      # /.well-known/jwks.json. Example wiring via env for a shared environment:
      #   active-kid: ${JWT_ACTIVE_KID:}
      #   keys:
      #     - kid: ${JWT_KID_1:}
      #       private-key-pem: ${JWT_PRIVATE_KEY_1:}
      #       public-key-pem: ${JWT_PUBLIC_KEY_1:}
      active-kid: ${JWT_ACTIVE_KID:}
      access-token-ttl: ${JWT_ACCESS_TTL:PT15M}
      issuer: calyvora
    refresh:
      ttl: ${REFRESH_TTL:P14D}
      cookie-name: calyvora_rt
      cookie-secure: ${REFRESH_COOKIE_SECURE:false}   # true behind HTTPS (prod)
    verification:
      ttl: ${VERIFICATION_TTL:P1D}
    invitation:
      ttl: ${INVITATION_TTL:P7D}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: false   # don't gate app health on SMTP reachability (Mailpit is optional locally)

logging:
  level:
    org.flywaydb: info
