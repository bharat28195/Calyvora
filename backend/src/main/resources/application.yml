spring:
  application:
    name: calyvora-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    # Prefer a full DB_URL when given (e.g. Neon: include ?sslmode=require). Otherwise assemble it
    # from components — lets a host wire DB_HOST/DB_PORT/DB_NAME straight from a managed database
    # with no manual JDBC-URL editing. Local default (all unset) stays localhost:5432/calyvora.
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:calyvora}}
    username: ${DB_USERNAME:calyvora}
    password: ${DB_PASSWORD:calyvora_local_dev}
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; JPA only validates
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    # Defaults target Mailpit for local dev (no auth, no TLS). A real provider needs
    # MAIL_USERNAME/MAIL_PASSWORD plus one of STARTTLS (587) or implicit SSL (465) — e.g. Hostinger:
    #   MAIL_HOST=smtp.hostinger.com  MAIL_PORT=587  MAIL_SMTP_AUTH=true  MAIL_SMTP_STARTTLS=true
    # MAIL_USERNAME must be the full mailbox address, and MAIL_FROM must match it — providers reject
    # a sender that differs from the authenticated mailbox.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          ssl:
            enable: ${MAIL_SMTP_SSL:false}
          # Never let an unreachable mail host hold a request thread open — registration and invite
          # both send inline, and the default JavaMail timeout is infinite.
          connectiontimeout: ${MAIL_TIMEOUT_MS:10000}
          timeout: ${MAIL_TIMEOUT_MS:10000}
          writetimeout: ${MAIL_TIMEOUT_MS:10000}

  mvc:
    # Send an unmatched URL to the exception handler (which answers 404) instead of letting it fall
    # through to the servlet container's default, where it surfaced as an opaque 500.
    throw-exception-if-no-handler-found: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never     # never leak stack traces (Sprint1 §13)

# --- Application-specific config (bound in AppProperties) ---
calyvora:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  mail:
    # Which transport sends verification / invitation mail. Leave blank to infer: a Resend API key
    # means Resend, an SMTP username means SMTP, neither means console (logged, never delivered).
    # Prefer Resend on a hosted deployment — it sends over HTTPS on 443, whereas outbound SMTP
    # (25/587/465) is blocked entirely by many hosts, Render's free tier included.
    provider: ${MAIL_PROVIDER:}
    from: ${MAIL_FROM:no-reply@calyvora.local}
    resend:
      api-key: ${RESEND_API_KEY:}
      api-url: ${RESEND_API_URL:https://api.resend.com/emails}
  security:
    jwt:
      # RS256 asymmetric signing with key rotation (SD-5). Public keys are served at
      # /.well-known/jwks.json.
      #
      # Two key slots, both env-fed. Leave them unset locally and an EPHEMERAL keypair is generated
      # at startup (zero-config dev/test) — but a restart then invalidates every outstanding token,
      # so any shared environment MUST set JWT_KID / JWT_PRIVATE_KEY / JWT_PUBLIC_KEY. PEMs are
      # PKCS#8 and may be supplied on a single line (the armor is stripped and whitespace ignored),
      # which is what makes them pasteable into a host's env-var UI.
      #
      # To rotate with no downtime: move the current trio into the _PREV slot, put the new keypair
      # in the primary slot, redeploy — old tokens still verify against _PREV; drop _PREV once every
      # token signed by it has expired (access-token-ttl).
      keys:
        - kid: ${JWT_KID:}
          private-key-pem: ${JWT_PRIVATE_KEY:}
          public-key-pem: ${JWT_PUBLIC_KEY:}
        - kid: ${JWT_KID_PREV:}
          private-key-pem: ${JWT_PRIVATE_KEY_PREV:}
          public-key-pem: ${JWT_PUBLIC_KEY_PREV:}
      active-kid: ${JWT_ACTIVE_KID:${JWT_KID:}}
      access-token-ttl: ${JWT_ACCESS_TTL:PT15M}
      issuer: calyvora
    refresh:
      ttl: ${REFRESH_TTL:P14D}
      cookie-name: calyvora_rt
      cookie-secure: ${REFRESH_COOKIE_SECURE:false}   # true behind HTTPS (prod)
    verification:
      ttl: ${VERIFICATION_TTL:P1D}
    invitation:
      ttl: ${INVITATION_TTL:P7D}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: false   # don't gate app health on SMTP reachability (Mailpit is optional locally)

logging:
  level:
    org.flywaydb: info
