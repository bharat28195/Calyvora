spring:
  application:
    name: calyvora-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/calyvora}
    username: ${DB_USERNAME:calyvora}
    password: ${DB_PASSWORD:calyvora_local_dev}
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; JPA only validates
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never     # never leak stack traces (Sprint1 §13)

# --- Application-specific config (bound in AppProperties) ---
calyvora:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  mail:
    from: ${MAIL_FROM:no-reply@calyvora.local}
  security:
    jwt:
      # HS256 shared secret for Sprint 1 (SD-5). MUST be overridden in any shared env.
      # Base64-encoded, >= 256 bits. Rotate to RS256 in Sprint 2.
      secret: ${JWT_SECRET:ZGV2LW9ubHktY2FseXZvcmEtc3ByaW50MS1qd3Qtc2VjcmV0LWNoYW5nZS1tZS1wbGVhc2U=}
      access-token-ttl: ${JWT_ACCESS_TTL:PT15M}
      issuer: calyvora
    refresh:
      ttl: ${REFRESH_TTL:P14D}
      cookie-name: calyvora_rt
      cookie-secure: ${REFRESH_COOKIE_SECURE:false}   # true behind HTTPS (prod)
    verification:
      ttl: ${VERIFICATION_TTL:P1D}
    invitation:
      ttl: ${INVITATION_TTL:P7D}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: false   # don't gate app health on SMTP reachability (Mailpit is optional locally)

logging:
  level:
    org.flywaydb: info
