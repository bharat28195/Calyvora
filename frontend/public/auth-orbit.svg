<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1200" viewBox="0 0 1700 1200">
  <!--
    The signed-out backdrop: the HR tools in orbit around the sign-in card.

    The product is called Orbit, so the backdrop says so — three tilted rings around the centre of the
    page, with a tool riding each one: people, attendance, payroll, leave, documents, reports, hiring.
    The card sits at the centre of its own system. This replaced a tiled mandala wallpaper, which was
    ornament that happened to be behind a payroll product rather than anything to do with it.

    Used as a CSS MASK, not an image (see .auth-bg::after in globals.css): everything is drawn in plain
    black because only the ALPHA is read, and the colour comes from the brand gradient underneath, so
    one file serves light and dark. The rings are drawn at half opacity, which is what makes them
    recede behind the tools once the whole thing is tinted down.

    GEOMETRY IS CHECKED BY SCRIPT, not by eye. Every node is verified to clear (a) the sign-in card and
    wordmark, which are opaque and would simply swallow it, (b) the edge of a 1440x900 viewport, and
    (c) every other node. Two of the first seven positions failed (a) and two failed (b); nothing about
    the file looked wrong. Moving a node by hand without re-running that check is how this breaks.

    The mask below punches a hole in each ring where a node sits, so the orbit line stops at the tool
    instead of being drawn straight through the middle of it.
  -->
  <defs>
    <g id="i-people">
      <circle cx="-4" cy="-5" r="4.2"/>
      <path d="M-11 8a7 7 0 0 1 14 0"/>
      <circle cx="7" cy="-3.5" r="3"/>
      <path d="M4 8a6.5 6.5 0 0 1 9.5-5.8"/>
    </g>
    <g id="i-clock">
      <circle r="11"/>
      <path d="M0 -6v6l5 3"/>
    </g>
    <!-- Payroll: a note with a rupee on it. The one glyph in the set that has to be legible at a tenth
         of full opacity, so it is drawn large inside the note rather than as fine detail. -->
    <g id="i-payroll">
      <rect x="-12.5" y="-8.5" width="25" height="17" rx="2.5"/>
      <path d="M-3.5 -4.5h7M-3.5 -1.5h7M-1.5 -4.5c3.5 0 3.5 3 0 3h-2l5 4"/>
    </g>
    <g id="i-calendar">
      <rect x="-11" y="-9" width="22" height="19" rx="2.5"/>
      <path d="M-11 -3h22M-5.5 -9v-4M5.5 -9v-4"/>
    </g>
    <g id="i-doc">
      <path d="M-8 -11h10l6 6v16a2.5 2.5 0 0 1-2.5 2.5h-13.5a2.5 2.5 0 0 1-2.5-2.5v-19.5a2.5 2.5 0 0 1 2.5-2.5z"/>
      <path d="M2 -11v6h6M-4 4h8"/>
    </g>
    <g id="i-chart">
      <path d="M-11 9.5h22"/>
      <path d="M-6.5 9.5v-7M0 9.5v-13M6.5 9.5v-5"/>
    </g>
    <g id="i-briefcase">
      <rect x="-12" y="-6" width="24" height="15.5" rx="2.5"/>
      <path d="M-5.5 -6v-3a2.5 2.5 0 0 1 2.5-2.5h6a2.5 2.5 0 0 1 2.5 2.5v3"/>
    </g>

    <!-- White keeps, black removes: a gap in the orbit line at every node. -->
    <mask id="gaps" maskUnits="userSpaceOnUse" x="0" y="0" width="1700" height="1200">
      <rect width="1700" height="1200" fill="white"/>
      <g fill="black">
        <circle cx="1148.1" cy="286.8" r="36"/>
        <circle cx="517.0" cy="892.2" r="36"/>
        <circle cx="1432.5" cy="341.9" r="36"/>
        <circle cx="267.5" cy="858.1" r="36"/>
        <circle cx="1230.3" cy="927.9" r="36"/>
        <circle cx="258.8" cy="283.9" r="36"/>
        <circle cx="1441.2" cy="916.1" r="36"/>
      </g>
    </mask>
  </defs>

  <g fill="none" stroke="#000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- The rings. Half opacity so they read as the path, not the subject. -->
    <g stroke-opacity="0.5" stroke-width="1.6" mask="url(#gaps)" transform="rotate(-18 850 600)">
      <ellipse cx="850" cy="600" rx="470" ry="350"/>
      <ellipse cx="850" cy="600" rx="640" ry="470"/>
      <ellipse cx="850" cy="600" rx="810" ry="590"/>
    </g>

    <!-- The tools riding them. Positions from the placement check — see the note above. -->
    <g>
      <circle cx="1148.1" cy="286.8" r="26"/><g transform="translate(1148.1,286.8)"><use href="#i-people"/></g>
      <circle cx="517.0" cy="892.2" r="26"/><g transform="translate(517.0,892.2)"><use href="#i-clock"/></g>
      <circle cx="1432.5" cy="341.9" r="26"/><g transform="translate(1432.5,341.9)"><use href="#i-payroll"/></g>
      <circle cx="267.5" cy="858.1" r="26"/><g transform="translate(267.5,858.1)"><use href="#i-calendar"/></g>
      <circle cx="1230.3" cy="927.9" r="26"/><g transform="translate(1230.3,927.9)"><use href="#i-doc"/></g>
      <circle cx="258.8" cy="283.9" r="26"/><g transform="translate(258.8,283.9)"><use href="#i-chart"/></g>
      <circle cx="1441.2" cy="916.1" r="26"/><g transform="translate(1441.2,916.1)"><use href="#i-briefcase"/></g>
    </g>
  </g>
</svg>
