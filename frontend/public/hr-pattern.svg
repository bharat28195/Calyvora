<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!--
    The signed-out wallpaper: small HR objects, tiled, the way a messaging app tiles doodles.

    Used as a CSS MASK, not an image — the colour comes from the theme token in globals.css, so one
    file serves light and dark instead of two. That is why everything is drawn in plain black: only
    the alpha matters.

    Seamless by construction rather than by clever edge-matching: every motif sits at least 20px
    inside the tile, so nothing is ever cut in half by the repeat. Twelve objects on a 3x4 grid, each
    rotated a little, which is enough variation that the eye reads it as scattered rather than as a
    grid of identical stamps.

    Everything is line art at a single stroke width. Filled shapes at this scale turn into grey blobs
    the moment the tile is tinted down to a few percent.
  -->
  <g fill="none" stroke="#000" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">

    <!-- Calendar — leave, holidays, the working month -->
    <g transform="translate(40,32) rotate(-8)">
      <rect x="-11" y="-9" width="22" height="20" rx="2.5"/>
      <path d="M-11 -3h22M-5.5 -9v-4M5.5 -9v-4"/>
      <path d="M-5 3h0.01M0 3h0.01M5 3h0.01M-5 7h0.01M0 7h0.01"/>
    </g>

    <!-- Clock — attendance, shifts, hours -->
    <g transform="translate(120,34) rotate(6)">
      <circle cx="0" cy="0" r="10.5"/>
      <path d="M0 -6v6l4.5 3"/>
    </g>

    <!-- ID badge — the employee record itself -->
    <g transform="translate(200,30) rotate(-5)">
      <rect x="-9" y="-7" width="18" height="17" rx="2.5"/>
      <path d="M-3 -7v-3.5a3 3 0 0 1 6 0V-7"/>
      <circle cx="0" cy="-1" r="2.6"/>
      <path d="M-4.5 6.5a4.5 4.5 0 0 1 9 0"/>
    </g>

    <!-- Payslip — a document with an amount on it -->
    <g transform="translate(40,92) rotate(5)">
      <path d="M-8 -11h12l4 4v18a2 2 0 0 1-2 2h-14a2 2 0 0 1-2-2v-20a2 2 0 0 1 2-2z"/>
      <path d="M4 -11v4h4"/>
      <path d="M-4.5 1h9M-4.5 5.5h6"/>
    </g>

    <!-- Person — the whole point of the product -->
    <g transform="translate(120,96) rotate(-4)">
      <circle cx="0" cy="-4.5" r="4"/>
      <path d="M-8 8.5a8 8 0 0 1 16 0"/>
    </g>

    <!-- Briefcase — the job, the role -->
    <g transform="translate(200,90) rotate(7)">
      <rect x="-11" y="-5" width="22" height="14" rx="2.5"/>
      <path d="M-4.5 -5v-3a2 2 0 0 1 2-2h5a2 2 0 0 1 2 2v3"/>
      <path d="M-11 1h22"/>
    </g>

    <!-- Chat bubble — the helpdesk ticket -->
    <g transform="translate(40,152) rotate(-6)">
      <path d="M-10 -8h20a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2h-12l-6 5v-5h-2a2 2 0 0 1-2-2v-11a2 2 0 0 1 2-2z"/>
      <path d="M-5 -1.5h10M-5 3h6"/>
    </g>

    <!-- Bar chart — headcount, insights -->
    <g transform="translate(120,156) rotate(4)">
      <path d="M-11 9h22"/>
      <path d="M-7 9v-7M0 9v-12M7 9v-5"/>
    </g>

    <!-- Approved — the leave request, the review, the claim -->
    <g transform="translate(200,150) rotate(-7)">
      <circle cx="0" cy="0" r="10"/>
      <path d="M-4.5 0.5l3 3 6-6.5"/>
    </g>

    <!-- Envelope — the invitation, the code, the notification -->
    <g transform="translate(40,208) rotate(6)">
      <rect x="-11" y="-8" width="22" height="16" rx="2.5"/>
      <path d="M-11 -6l11 8 11-8"/>
    </g>

    <!-- Coffee — the break, the human bit -->
    <g transform="translate(120,212) rotate(-5)">
      <path d="M-8 -3h14v7a5 5 0 0 1-5 5h-4a5 5 0 0 1-5-5z"/>
      <path d="M6 -1h2.5a2.5 2.5 0 0 1 0 5H6"/>
      <path d="M-4 -7.5c0-1.5 1.5-1.5 1.5-3M1 -7.5c0-1.5 1.5-1.5 1.5-3"/>
    </g>

    <!-- Target — the goal, the performance cycle -->
    <g transform="translate(200,206) rotate(5)">
      <circle cx="0" cy="0" r="10"/>
      <circle cx="0" cy="0" r="5.5"/>
      <circle cx="0" cy="0" r="1.2"/>
    </g>

  </g>
</svg>
