<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!--
    The signed-out wallpaper: large mandala medallions on a field of HR objects.

    Used as a CSS MASK, not an image — the colour comes from the theme token in globals.css, so one
    file serves light and dark. Everything is drawn in plain black because only the alpha matters.

    HOW IT TILES, which is easy to break: one medallion at the centre of the tile, and the SAME
    medallion centred on each of the four corners. A corner copy is three-quarters outside the tile,
    so when the tile repeats its four clipped quarters meet across the seam and complete each other.
    The HR objects on the edge midpoints work the same way — each is drawn twice, on opposite edges,
    because those are the same point once the tile repeats. Move any of them and the seam appears.

    Geometry, all checked by script rather than by eye:
      tile 400, medallion radius 115
      centre-to-corner 283 vs 230 combined diameter  → medallions never touch
      diagonal gaps at (100,100) etc, 26px of clearance for a 12px glyph

    Medallions are 8- and 16-fold symmetric, built by rotating one petal, one tick and one scallop
    with <use>, so the symmetry is exact and five medallions cost one definition.
  -->
  <defs>
    <!-- A lotus petal: outer shape with an inner line, so the ring reads as ornament rather than as
         eight plain blobs at this size. -->
    <g id="p">
      <path d="M0 -22c11 -11 11 -21 0 -32c-11 11 -11 21 0 32z"/>
      <path d="M0 -27c4 -5 4 -10 0 -16c-4 6 -4 11 0 16z"/>
    </g>
    <!-- One tick of the inner rule. -->
    <path id="t" d="M0 -62v-9"/>
    <!-- One scallop of the outer band. -->
    <path id="s" d="M-14 -84a14 14 0 0 1 28 0"/>
    <!-- One dot of the outer bead ring. -->
    <circle id="d" cx="0" cy="-104" r="1.6"/>

    <g id="m">
      <circle r="6"/>
      <circle r="13"/>
      <g>
        <use href="#p"/><use href="#p" transform="rotate(45)"/>
        <use href="#p" transform="rotate(90)"/><use href="#p" transform="rotate(135)"/>
        <use href="#p" transform="rotate(180)"/><use href="#p" transform="rotate(225)"/>
        <use href="#p" transform="rotate(270)"/><use href="#p" transform="rotate(315)"/>
      </g>
      <circle r="62"/>
      <g>
        <use href="#t"/><use href="#t" transform="rotate(22.5)"/>
        <use href="#t" transform="rotate(45)"/><use href="#t" transform="rotate(67.5)"/>
        <use href="#t" transform="rotate(90)"/><use href="#t" transform="rotate(112.5)"/>
        <use href="#t" transform="rotate(135)"/><use href="#t" transform="rotate(157.5)"/>
        <use href="#t" transform="rotate(180)"/><use href="#t" transform="rotate(202.5)"/>
        <use href="#t" transform="rotate(225)"/><use href="#t" transform="rotate(247.5)"/>
        <use href="#t" transform="rotate(270)"/><use href="#t" transform="rotate(292.5)"/>
        <use href="#t" transform="rotate(315)"/><use href="#t" transform="rotate(337.5)"/>
      </g>
      <g>
        <use href="#s"/><use href="#s" transform="rotate(45)"/>
        <use href="#s" transform="rotate(90)"/><use href="#s" transform="rotate(135)"/>
        <use href="#s" transform="rotate(180)"/><use href="#s" transform="rotate(225)"/>
        <use href="#s" transform="rotate(270)"/><use href="#s" transform="rotate(315)"/>
      </g>
      <g>
        <use href="#d"/><use href="#d" transform="rotate(22.5)"/>
        <use href="#d" transform="rotate(45)"/><use href="#d" transform="rotate(67.5)"/>
        <use href="#d" transform="rotate(90)"/><use href="#d" transform="rotate(112.5)"/>
        <use href="#d" transform="rotate(135)"/><use href="#d" transform="rotate(157.5)"/>
        <use href="#d" transform="rotate(180)"/><use href="#d" transform="rotate(202.5)"/>
        <use href="#d" transform="rotate(225)"/><use href="#d" transform="rotate(247.5)"/>
        <use href="#d" transform="rotate(270)"/><use href="#d" transform="rotate(292.5)"/>
        <use href="#d" transform="rotate(315)"/><use href="#d" transform="rotate(337.5)"/>
      </g>
      <circle r="115"/>
    </g>

    <!-- The HR objects. Simple outlines only: anything with interior detail turns to a smudge once
         the whole tile is tinted down to a tenth of its opacity. -->
    <g id="i-person">
      <circle cx="0" cy="-4.5" r="4"/>
      <path d="M-8 8a8 8 0 0 1 16 0"/>
    </g>
    <g id="i-clock">
      <circle r="9.5"/>
      <path d="M0 -5.5v5.5l4.5 2.5"/>
    </g>
    <g id="i-calendar">
      <rect x="-9.5" y="-8" width="19" height="17" rx="2.5"/>
      <path d="M-9.5 -2.5h19M-4.5 -8v-4M4.5 -8v-4"/>
    </g>
    <g id="i-briefcase">
      <rect x="-10" y="-5" width="20" height="13" rx="2.5"/>
      <path d="M-4.5 -5v-2.5a2 2 0 0 1 2-2h5a2 2 0 0 1 2 2v2.5"/>
    </g>
    <g id="i-doc">
      <path d="M-7 -10h9l5 5v15a2 2 0 0 1-2 2h-12a2 2 0 0 1-2-2v-18a2 2 0 0 1 2-2z"/>
      <path d="M2 -10v5h5M-3.5 3h7"/>
    </g>
    <g id="i-mail">
      <rect x="-10" y="-7.5" width="20" height="15" rx="2.5"/>
      <path d="M-10 -5.5l10 7.5 10-7.5"/>
    </g>
    <g id="i-chat">
      <path d="M-9.5 -8h19a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-11l-6 4.5V6h-2a2 2 0 0 1-2-2V-6a2 2 0 0 1 2-2z"/>
    </g>
    <g id="i-chart">
      <path d="M-10 8.5h20"/>
      <path d="M-6 8.5v-6M0 8.5v-11M6 8.5v-4.5"/>
    </g>
  </defs>

  <g fill="none" stroke="#000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">

    <!-- The medallions: centre, and one on each corner to interlock across the seam. -->
    <use href="#m" transform="translate(200,200)"/>
    <use href="#m" transform="translate(0,0)"/>
    <use href="#m" transform="translate(400,0)"/>
    <use href="#m" transform="translate(0,400)"/>
    <use href="#m" transform="translate(400,400)"/>

    <!-- The diagonal gaps between medallions. -->
    <use href="#i-person" transform="translate(100,100)"/>
    <use href="#i-clock" transform="translate(300,100)"/>
    <use href="#i-calendar" transform="translate(100,300)"/>
    <use href="#i-briefcase" transform="translate(300,300)"/>

    <!-- The edge midpoints. Each drawn on BOTH opposite edges, because those are one point once the
         tile repeats — half of each shows on either side of the seam and they complete each other. -->
    <use href="#i-doc" transform="translate(200,0)"/>
    <use href="#i-doc" transform="translate(200,400)"/>
    <use href="#i-chart" transform="translate(0,200)"/>
    <use href="#i-chart" transform="translate(400,200)"/>

    <!-- Eight more, off the axes, to fill the field the way a messaging app's doodles do.
         These sit in the slack between a corner medallion and the centre one — 37px of clearance.
         The obvious-looking positions on the axes (200,100) and so on are NOT free: they fall 15px
         INSIDE the centre medallion, which the geometry check catches and the eye would not until it
         shipped. -->
    <use href="#i-mail" transform="translate(140,60)"/>
    <use href="#i-chat" transform="translate(60,140)"/>
    <use href="#i-doc" transform="translate(260,60)"/>
    <use href="#i-chart" transform="translate(340,140)"/>
    <use href="#i-chart" transform="translate(60,260)"/>
    <use href="#i-mail" transform="translate(140,340)"/>
    <use href="#i-chat" transform="translate(340,260)"/>
    <use href="#i-person" transform="translate(260,340)"/>

  </g>
</svg>
