<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <!--
    The signed-out wallpaper: mandala medallions, with small HR objects in the spaces between them.

    Used as a CSS MASK, not an image — the colour comes from the theme token in globals.css, so one
    file serves light and dark. Everything is drawn in plain black because only the alpha matters.

    HOW IT TILES, which is the whole trick: one full medallion in the middle, and the SAME medallion
    centred on each of the four corners. A corner medallion is three-quarters outside the tile, so
    when the tile repeats, its four clipped quarters meet across the seam and complete each other into
    a whole one. That is what makes it read as a continuous ornamental field rather than a grid of
    stamps, and it is why the corner copies must not be moved.

    The medallions are 8- and 16-fold symmetric, built from one petal, one tick and one scallop
    rotated by <use>, so the shapes stay exactly consistent and the file stays small.

    Radii are chosen so nothing collides: centre-to-corner is 226px and each medallion reaches 78px,
    leaving a gap around the diagonal midpoints where the HR glyphs sit.
  -->
  <defs>
    <!-- One petal, pointing up, used eight times to make a ring. -->
    <path id="p" d="M0 -17c7 -8 7 -17 0 -24c-7 7 -7 16 0 24z"/>
    <!-- One tick on the inner rule. -->
    <path id="t" d="M0 -45v-6"/>
    <!-- One scallop of the outer band. -->
    <path id="s" d="M-9 -58a9 9 0 0 1 18 0"/>

    <!-- The medallion. Every ring is the same element rotated, so the symmetry is exact. -->
    <g id="m">
      <circle r="4.5"/>
      <circle r="10"/>
      <g>
        <circle cx="0" cy="-15.5" r="1.5"/>
        <use href="#p" transform="rotate(45)"/>
        <use href="#p" transform="rotate(90)"/>
        <use href="#p" transform="rotate(135)"/>
        <use href="#p" transform="rotate(180)"/>
        <use href="#p" transform="rotate(225)"/>
        <use href="#p" transform="rotate(270)"/>
        <use href="#p" transform="rotate(315)"/>
        <use href="#p"/>
      </g>
      <circle r="45"/>
      <g>
        <use href="#t"/>
        <use href="#t" transform="rotate(22.5)"/>
        <use href="#t" transform="rotate(45)"/>
        <use href="#t" transform="rotate(67.5)"/>
        <use href="#t" transform="rotate(90)"/>
        <use href="#t" transform="rotate(112.5)"/>
        <use href="#t" transform="rotate(135)"/>
        <use href="#t" transform="rotate(157.5)"/>
        <use href="#t" transform="rotate(180)"/>
        <use href="#t" transform="rotate(202.5)"/>
        <use href="#t" transform="rotate(225)"/>
        <use href="#t" transform="rotate(247.5)"/>
        <use href="#t" transform="rotate(270)"/>
        <use href="#t" transform="rotate(292.5)"/>
        <use href="#t" transform="rotate(315)"/>
        <use href="#t" transform="rotate(337.5)"/>
      </g>
      <g>
        <use href="#s"/>
        <use href="#s" transform="rotate(45)"/>
        <use href="#s" transform="rotate(90)"/>
        <use href="#s" transform="rotate(135)"/>
        <use href="#s" transform="rotate(180)"/>
        <use href="#s" transform="rotate(225)"/>
        <use href="#s" transform="rotate(270)"/>
        <use href="#s" transform="rotate(315)"/>
      </g>
      <circle r="70" stroke-dasharray="2 7"/>
      <circle r="78"/>
    </g>
  </defs>

  <g fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">

    <!-- The full medallion, and the four corner copies that complete each other across the seam. -->
    <use href="#m" transform="translate(160,160)"/>
    <use href="#m" transform="translate(0,0)"/>
    <use href="#m" transform="translate(320,0)"/>
    <use href="#m" transform="translate(0,320)"/>
    <use href="#m" transform="translate(320,320)"/>

    <!-- The HR objects, in the four gaps the medallions leave. Kept small and simple: at this size
         anything with interior detail collapses into a smudge once the tile is tinted down. -->

    <!-- Person — the whole point of the product -->
    <g transform="translate(80,80)">
      <circle cx="0" cy="-4" r="3.6"/>
      <path d="M-7 7.5a7 7 0 0 1 14 0"/>
    </g>

    <!-- Clock — attendance, shifts, hours -->
    <g transform="translate(240,80)">
      <circle r="9"/>
      <path d="M0 -5v5l4 2.5"/>
    </g>

    <!-- Calendar — leave and holidays -->
    <g transform="translate(80,240)">
      <rect x="-9" y="-7.5" width="18" height="16" rx="2.5"/>
      <path d="M-9 -2.5h18M-4.5 -7.5v-3.5M4.5 -7.5v-3.5"/>
    </g>

    <!-- Briefcase — the job, the role -->
    <g transform="translate(240,240)">
      <rect x="-9.5" y="-4.5" width="19" height="12" rx="2.5"/>
      <path d="M-4 -4.5v-2.5a1.8 1.8 0 0 1 1.8-1.8h4.4a1.8 1.8 0 0 1 1.8 1.8v2.5"/>
    </g>

  </g>
</svg>
