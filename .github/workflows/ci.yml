name: CI

# Watch the branches work actually happens on, not just main. product/hr-platform is what Render
# deploys from and what every commit lands on, so a workflow watching only main was watching nothing:
# the full suite has not run in CI for any of this work. Those 23 minutes are free here and blocking
# on a laptop, which is the entire argument for CI owning them.
on:
  push:
    branches: [ main, "product/**", "feature/**" ]
  pull_request:
    branches: [ main, "product/**" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven · JDK 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Testcontainers uses the Docker daemon preinstalled on ubuntu-latest runners.
      - name: Build & test
        run: mvn -B --no-transfer-progress verify

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check & build
        run: npm run build

      - name: Unit tests
        run: npm run test -- --run
