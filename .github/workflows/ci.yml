name: CI

# Watch the branches work actually happens on, not just main. product/hr-platform is what Render
# deploys from and what every commit lands on, so a workflow watching only main was watching nothing:
# the full suite has not run in CI for any of this work. Those 23 minutes are free here and blocking
# on a laptop, which is the entire argument for CI owning them.
on:
  push:
    branches: [ main, "product/**", "feature/**" ]
  pull_request:
    branches: [ main, "product/**" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven · JDK 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Testcontainers uses the Docker daemon preinstalled on ubuntu-latest runners.
      - name: Build & test
        run: mvn -B --no-transfer-progress verify

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check & build
        run: npm run build

      - name: Unit tests
        run: npm run test -- --run

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # Chromium only. The suite is testing our routing and our screens, not browser differences,
      # and three engines would triple the minutes to re-prove the same thing.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Runs against the mock backend, so no Postgres and no Java here. Playwright builds and
      # serves the app itself (see playwright.config.ts).
      - name: End-to-end tests
        run: npm run e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
